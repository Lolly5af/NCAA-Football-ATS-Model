name: CFB ATS historical backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build historical training data
        run: python -m src.pipeline --build-history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Run 2023-2025 walk-forward backtest
        run: python -m src.backtest --start-season 2023 --end-season 2025
      - name: Commit backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/processed
          git diff --cached --quiet || git commit -m "Add walk-forward backtest results"
          git push
